<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#14100c" />
    <title>GIFcommit presents Golden Grids</title>
    <meta
      name="description"
      content="Golden Grids is a responsive layout library driven by the Fibonacci Sequence. Instead of traditional rows and columns you get proportionally aligned boxes that follow the golden ratio. What you do with those boxes is your business, but at least you won't be boring."
    />
    <link rel="canonical" href="https://gregoryedgerton.github.io/golden-grids-site/" />
    <!-- The share card. Its picture has to be a whole address: the sites that draw cards fetch it from elsewhere. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Golden Grids" />
    <meta property="og:url" content="https://gregoryedgerton.github.io/golden-grids-site/" />
    <meta property="og:title" content="GIFcommit presents Golden Grids" />
    <meta
      property="og:description"
      content="Golden Grids is a responsive layout library driven by the Fibonacci Sequence. Instead of traditional rows and columns you get proportionally aligned boxes that follow the golden ratio. What you do with those boxes is your business, but at least you won't be boring."
    />
    <meta property="og:image" content="https://gregoryedgerton.github.io/golden-grids-site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Golden Grids, in gold script with depth, over a darkened still of a storefront blast from an old film." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- GG, drawn as the title's name is. Raster, because share sheets and iOS do not read an SVG icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="%BASE_URL%favicon-96.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700&family=Oswald:wght@300;400&family=Pacifico&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Golden Grids is a Fibonacci layout library. This page needs JavaScript; the library is at
      <a href="https://www.npmjs.com/package/@gifcommit/golden-grids">npmjs.com/package/@gifcommit/golden-grids</a>.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
