version: 2
updates:
  # The title screen prints the library's version from the installed copy, so
  # a new release of the library has to reach the lockfile to reach the page.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
    ignore:
      # semantic-release's notes generator carries an older changelog writer
      # than version 10 of this preset needs, and the release job fails on it.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
