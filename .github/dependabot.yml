version: 2
updates:
  # The title screen prints the library's version from the installed copy, so
  # a new release of the library has to reach the lockfile to reach the page.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
    ignore:
      # semantic-release's notes generator carries an older changelog writer
      # than version 10 of this preset needs, and the release job fails on it.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
      # eslint-plugin-jsx-a11y accepts ESLint up to 9, and npm refuses to
      # install 10 beside it. Lift these two when the plugin supports 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      # typescript-eslint accepts TypeScript below 6.1, so a minor is as
      # unusable as a major and would block the whole tooling group it rides
      # in. Only patches are taken. Lift this when typescript-eslint moves.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # Minor and patch updates of the tooling arrive together. A major
      # arrives alone, so one that cannot be taken does not hold up the rest.
      development:
        dependency-type: development
        update-types: ["minor", "patch"]

  # The versions of the actions the workflow runs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
